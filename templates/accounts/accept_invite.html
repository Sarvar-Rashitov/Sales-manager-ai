{% extends "base.html" %}
{% block title %}Accept Invitation{% endblock %}
{% block auth_content %}
<div class="w-full max-w-md">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-8 border border-gray-200 dark:border-gray-700">
    <h1 class="text-2xl font-bold mb-2">Accept Invitation</h1>
    <p class="text-gray-500 text-sm mb-6">Create your account to join the team.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
        <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required />
        {% if field.errors %}<p class="text-red-500 text-xs mt-1">{{ field.errors|join:", " }}</p>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-medium">Join Team</button>
    </form>
  </div>
</div>
{% endblock %}
