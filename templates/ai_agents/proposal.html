{% extends "base.html" %}
{% block title %}AI Proposal - {{ lead.title }}{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold">AI Generated Proposal</h1>
    <a href="{% url 'crm:lead_detail' lead.pk %}" class="inline-flex items-center gap-1 text-gray-400 hover:text-gray-600">
      <i data-lucide="arrow-left" aria-hidden="true"></i>
      Back to Lead
    </a>
  </div>
  <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-8">
    <div class="prose dark:prose-invert max-w-none">
      <pre class="whitespace-pre-wrap text-sm font-sans">{{ proposal }}</pre>
    </div>
  </div>
  <div class="flex space-x-3">
    <a href="{% url 'sales:generate_proposal' lead.pk %}"
       class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
      <i data-lucide="refresh-cw" aria-hidden="true"></i>
      Regenerate
    </a>
  </div>
</div>
{% endblock %}
