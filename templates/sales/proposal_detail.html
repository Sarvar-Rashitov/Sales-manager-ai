{% extends "base.html" %}
{% block title %}{{ proposal.title }}{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold">{{ proposal.title }}</h1>
    <a href="{% url 'sales:proposal_list' %}" class="inline-flex items-center gap-1 text-gray-400 hover:text-gray-600">
      <i data-lucide="arrow-left" aria-hidden="true"></i>
      Proposals
    </a>
  </div>
  <div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-8">
    <pre class="whitespace-pre-wrap text-sm font-sans">{{ proposal.content }}</pre>
  </div>
</div>
{% endblock %}
